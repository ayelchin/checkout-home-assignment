services:
  paymentgateway.api:
    image: ${DOCKER_REGISTRY-}paymentgatewayapi
    build:
      context: .
      dockerfile: src/PaymentGateway.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Bank__BaseUrl: http://bank_simulator:8080
    ports:
      - "127.0.0.1:5055:8080"
    depends_on:
      - bank_simulator
  bank_simulator:
      container_name: bank_simulator
      image: bbyars/mountebank:2.8.1
      ports:
        - "2525:2525"
        - "8080:8080"
      command: --configfile /imposters/bank_simulator.ejs --allowInjection
      volumes:
        - type: bind
          source: ./imposters
          target: /imposters
